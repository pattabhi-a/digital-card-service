name: Publish Architecture Analysis to Confluence

on:
  push:
    branches:
      - feat/architecture-analysis
    paths:
      - 'detailed_findings/**'
      - 'synthesis_patterns/**'
      - 'strategic/**'
  workflow_dispatch:

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate HTML documents exist
        run: |
          echo "Validating HTML document structure..."

          # Check detailed_findings
          for file in \
            detailed_findings/business_context/index.html \
            detailed_findings/capabilities/index.html \
            detailed_findings/code_issues/index.html \
            detailed_findings/security/index.html \
            detailed_findings/performance/index.html \
            detailed_findings/deployment/index.html \
            detailed_findings/nfrs/index.html; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

          # Check synthesis_patterns
          for file in \
            synthesis_patterns/business_capability_synthesis/index.html \
            synthesis_patterns/technical_patterns/index.html \
            synthesis_patterns/risk_synthesis/index.html \
            synthesis_patterns/modernization_patterns/index.html \
            synthesis_patterns/scalability_blueprint/index.html \
            synthesis_patterns/observability_strategy/index.html \
            synthesis_patterns/devops_maturity/index.html; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

          # Check strategic
          if [ ! -f "strategic/executive-summary.html" ]; then
            echo "❌ Missing: strategic/executive-summary.html"
            exit 1
          fi
          echo "✅ Found: strategic/executive-summary.html"

          echo "✅ All HTML documents validated successfully"

      - name: Validate HTML well-formedness
        run: |
          echo "Checking HTML syntax..."
          # Install html5lib for validation
          apt-get update && apt-get install -y html5-tidy 2>/dev/null || true

          # Basic validation (check for unclosed tags)
          for file in $(find detailed_findings synthesis_patterns strategic -name "*.html"); do
            if ! grep -q "</html>" "$file"; then
              echo "❌ Missing closing </html> in $file"
              exit 1
            fi
            echo "✅ Valid: $file"
          done

          echo "✅ All HTML documents are well-formed"

      - name: Check for broken internal links
        run: |
          echo "Validating internal links..."

          # Check that all href links to ../detailed_findings/ exist
          broken_links=0

          for html_file in $(find synthesis_patterns strategic -name "*.html"); do
            while IFS= read -r line; do
              if [[ $line =~ href=\"\.\./([^\"]+)\" ]]; then
                link="${BASH_REMATCH[1]}"
                if [[ ! "$link" =~ ^http ]]; then
                  resolved_path=$(echo "$html_file" | xargs dirname)
                  full_path="$resolved_path/../$link"
                  if [ ! -f "$full_path" ]; then
                    echo "⚠️  Possible broken link in $html_file: $link"
                    broken_links=$((broken_links + 1))
                  fi
                fi
              fi
            done < "$html_file"
          done

          if [ $broken_links -gt 0 ]; then
            echo "⚠️  Found $broken_links potential broken links (may be false positives)"
          else
            echo "✅ All internal links appear valid"
          fi

      - name: Generate document index
        run: |
          cat > ARCHITECTURE_DOCS_INDEX.md << 'EOF'
          # Digital Card Service - Architecture Analysis Documentation

          ## Overview
          This directory contains comprehensive enterprise architecture analysis for the MOSIP Digital Card Service microservice.

          ## Document Structure

          ### 1. Detailed Findings (Technical Deep-Dive)
          - **[Business Context](detailed_findings/business_context/)** - MOSIP ecosystem positioning, stakeholders, KPIs
          - **[Capabilities](detailed_findings/capabilities/)** - Feature breakdown, APIs, integrations
          - **[Code Quality & Issues](detailed_findings/code_issues/)** - Architecture, technical debt assessment
          - **[Security Analysis](detailed_findings/security/)** - Vulnerabilities, risk matrix
          - **[Performance Analysis](detailed_findings/performance/)** - Bottlenecks, scalability constraints
          - **[Deployment Analysis](detailed_findings/deployment/)** - Kubernetes, CI/CD, production readiness
          - **[Non-Functional Requirements](detailed_findings/nfrs/)** - SLA targets, observability maturity

          ### 2. Synthesis Patterns (Cross-Functional Insights)
          - **[Business Capability Synthesis](synthesis_patterns/business_capability_synthesis/)** - Align technical findings with business outcomes
          - **[Technical Patterns](synthesis_patterns/technical_patterns/)** - Architectural patterns, trade-offs, evolution
          - **[Risk Synthesis](synthesis_patterns/risk_synthesis/)** - Consolidated P0/P1/P2 risks with mitigation timeline
          - **[Modernization Patterns](synthesis_patterns/modernization_patterns/)** - Recommended improvements (async, caching, resilience)
          - **[Scalability Blueprint](synthesis_patterns/scalability_blueprint/)** - Path to 20x growth
          - **[Observability Strategy](synthesis_patterns/observability_strategy/)** - Metrics, logs, traces, alerting
          - **[DevOps Maturity](synthesis_patterns/devops_maturity/)** - CI/CD, IaC, testing, operations automation

          ### 3. Strategic Summary (Executive View)
          - **[Executive Summary](strategic/executive-summary.html)** - 1-page overview with C4 diagrams, risk matrix, modernization roadmap

          ## How to Use This Documentation

          1. **For Architects/Leaders:** Start with [Executive Summary](strategic/executive-summary.html)
          2. **For Technical Deep-Dive:** Read [Detailed Findings](detailed_findings/) by category
          3. **For Implementation Planning:** Reference [Synthesis Patterns](synthesis_patterns/) for specific modernization approaches
          4. **For Risk Management:** Review [Risk Synthesis](synthesis_patterns/risk_synthesis/) for P0/P1/P2 priorities

          ## Key Metrics at a Glance

          | Metric | Current | Target | Impact |
          |--------|---------|--------|--------|
          | Maturity | 6.5/10 | 8.5/10 | +2.0 points |
          | Throughput | 50K cards/month | 1M+ cards/month | 20x growth |
          | MTTR | 30-60 min | <5 min | 12x faster |
          | Cost/Card | $110 | $5 | 22x better |
          | Investment | - | $160K | 5-month ROI |

          ## Navigation
          All documents include:
          - Internal deeplinks for cross-referencing
          - Responsive HTML formatting
          - SVG diagrams for visual clarity
          - Color-coded risk/priority indicators
          - Table of contents with jump links

          ## Generated By
          Architecture Analysis Framework v1.0
          GitHub Repository: [digital-card-service](https://github.com/mosip/digital-card-service)
          Generated: $(date)
          EOF

          echo "✅ Document index generated: ARCHITECTURE_DOCS_INDEX.md"

      - name: Create GitHub Pages site
        run: |
          echo "Preparing GitHub Pages deployment..."

          # Create docs directory for GitHub Pages
          mkdir -p docs

          # Copy all HTML documents
          cp -r detailed_findings docs/
          cp -r synthesis_patterns docs/
          cp -r strategic docs/
          cp ARCHITECTURE_DOCS_INDEX.md docs/README.md

          # Create index.html for root
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
