name: Publish Architecture Analysis to Confluence

on:
  push:
    branches:
      - feat/architecture-analysis
    paths:
      - '.github/workflows/publish-architecture-analysis.yml'
      - 'detailed_findings/**'
      - 'synthesis_patterns/**'
      - 'strategic/**'
  workflow_dispatch:

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML documents
        run: |
          echo "Validating HTML documents..."
          test -f detailed_findings/business_context/index.html || exit 1
          test -f detailed_findings/capabilities/index.html || exit 1
          test -f detailed_findings/code_issues/index.html || exit 1
          test -f detailed_findings/security/index.html || exit 1
          test -f detailed_findings/performance/index.html || exit 1
          test -f detailed_findings/deployment/index.html || exit 1
          test -f detailed_findings/nfrs/index.html || exit 1
          test -f synthesis_patterns/business_capability_synthesis/index.html || exit 1
          test -f synthesis_patterns/technical_patterns/index.html || exit 1
          test -f synthesis_patterns/risk_synthesis/index.html || exit 1
          test -f synthesis_patterns/modernization_patterns/index.html || exit 1
          test -f synthesis_patterns/scalability_blueprint/index.html || exit 1
          test -f synthesis_patterns/observability_strategy/index.html || exit 1
          test -f synthesis_patterns/devops_maturity/index.html || exit 1
          test -f strategic/executive-summary.html || exit 1
          echo "✅ All HTML documents validated"

      - name: Publish to Confluence
        run: |
          python3 << 'PYTHON_EOF'
          import requests
          import base64
          import json
          import sys

          # Configuration
          base_url = "${{ secrets.CONFLUENCE_BASE_URL }}"
          username = "${{ secrets.CONFLUENCE_USERNAME }}"
          api_token = "${{ secrets.CONFLUENCE_API_TOKEN }}"

          if not all([base_url, username, api_token]):
            print("⚠️ Confluence credentials not fully configured")
            sys.exit(0)

          base_url = base_url.rstrip('/')

          # Prepare auth
          auth_string = f"{username}:{api_token}"
          auth_header = "Basic " + base64.b64encode(auth_string.encode()).decode()
          headers = {
            "Authorization": auth_header,
            "Content-Type": "application/json"
          }

          try:
            print("Creating page in Confluence SD space...")

            payload = {
              "type": "page",
              "title": "Digital Card Service - Architecture Analysis",
              "space": {"key": "SD"},
              "body": {
                "storage": {
                  "value": "<h1>Digital Card Service - Enterprise Architecture Analysis</h1><p>Comprehensive enterprise architecture modernization analysis for the MOSIP digital-card-service microservice.</p><p><strong>Analysis Sections:</strong></p><ul><li>Business Context & Capabilities</li><li>Code Quality & Technical Debt</li><li>Security Posture</li><li>Performance Analysis</li><li>Deployment Maturity</li><li>Non-Functional Requirements</li><li>Modernization Roadmap</li></ul>",
                  "representation": "storage"
                }
              }
            }

            api_url = f"{base_url}/wiki/rest/api/content"
            print(f"Endpoint: {api_url}")

            response = requests.post(api_url, json=payload, headers=headers, timeout=10)
            print(f"HTTP Status: {response.status_code}")

            if response.status_code in [200, 201]:
              data = response.json()
              page_id = data.get("id")
              page_link = data.get("_links", {}).get("webui")
              print(f"✅ SUCCESS! Page created in Confluence")
              print(f"Page ID: {page_id}")
              if page_link:
                print(f"URL: {page_link}")
            elif response.status_code == 403:
              print("⚠️ Got 403 Forbidden")
              print("Possible solution: Check API token has 'write:pages' permission")
              print("Or: Regenerate API token from Atlassian account settings")
            else:
              print(f"❌ Failed with status {response.status_code}")
              print("Response:")
              print(response.text[:500])

          except Exception as e:
            print(f"❌ Error: {e}")
            import traceback
            traceback.print_exc()

          print(f"Base URL: {base_url}")

          # Prepare auth
          auth_string = f"{username}:{api_token}"
          auth_header = "Basic " + base64.b64encode(auth_string.encode()).decode()
          headers = {
            "Authorization": auth_header,
            "Content-Type": "application/json"
          }

          try:
            # Ensure base_url doesn't have trailing slash
            base_url = base_url.rstrip('/')
            print(f"Base URL: {base_url}")

            # Test connection first
            print("\n1️⃣ Testing Confluence connection...")

            # Try different API endpoint variations
            endpoints_to_try = [
              f"{base_url}/wiki/rest/api/v2/spaces",
              f"{base_url}/rest/api/v2/spaces",
              f"{base_url}/rest/api/space",
              f"{base_url}/wiki/rest/api/content"
            ]

            response = None
            test_url = None
            for endpoint in endpoints_to_try:
              print(f"   Trying: {endpoint}")
              try:
                response = requests.get(endpoint, headers=headers, timeout=5)
                print(f"      Status: {response.status_code}")
                if response.status_code in [200, 401, 403]:
                  test_url = endpoint
                  break
              except:
                pass

            if not response or response.status_code == 404:
              print("   ⚠️ All endpoints returned 404")
              print("   Please verify your CONFLUENCE_BASE_URL is correct")
              print(f"   Expected format: https://your-workspace.atlassian.net")
              sys.exit(0)

            if response.status_code == 200:
              spaces = response.json().get("results", [])
              print(f"   ✅ Connected! Found {len(spaces)} spaces")
              space_keys = [s.get("key") for s in spaces]
              print(f"   Available spaces: {space_keys}")

              if "SD" in space_keys:
                print("   ✅ Space 'SD' found!")
              else:
                print("   ⚠️ Space 'SD' not found in available spaces")
                print(f"      Available: {', '.join(space_keys)}")
            else:
              print(f"   ⚠️ Could not list spaces: {response.status_code}")
              print(f"   Response: {response.text[:300]}")

            # Now attempt to create page using v2 API
            print("\n2️⃣ Creating page in SD space...")

            # V2 API payload structure
            payload_v2 = {
              "spaceId": "0",  # Will be updated with actual space ID if available
              "title": "Digital Card Service - Architecture Analysis",
              "type": "page",
              "body": {
                "representation": "storage",
                "value": "<h1>Digital Card Service Architecture Analysis</h1><p>Comprehensive enterprise architecture analysis document</p>"
              }
            }

            # Try v2 API first
            api_url_v2 = f"{base_url}/wiki/rest/api/v2/pages"
            print(f"   Trying v2 API: {api_url_v2}")

            response = requests.post(api_url_v2, json=payload_v2, headers=headers, timeout=10)
            print(f"   Status: {response.status_code}")

            if response.status_code in [200, 201]:
              data = response.json()
              page_id = data.get("id")
              print(f"   ✅ Page created successfully (v2 API)!")
              print(f"   Page ID: {page_id}")
            else:
              # Try v1 API as fallback
              print(f"   v2 API failed ({response.status_code}), trying v1 API...")

              payload_v1 = {
                "type": "page",
                "title": "Digital Card Service - Architecture Analysis",
                "space": {"key": "SD"},
                "body": {
                  "storage": {
                    "value": "<h1>Digital Card Service Architecture Analysis</h1><p>Comprehensive enterprise architecture analysis document</p>",
                    "representation": "storage"
                  }
                }
              }

              api_url_v1 = f"{base_url}/rest/api/content"
              print(f"   Trying v1 API: {api_url_v1}")

              response = requests.post(api_url_v1, json=payload_v1, headers=headers, timeout=10)
              print(f"   Status: {response.status_code}")

              if response.status_code in [200, 201]:
                data = response.json()
                page_id = data.get("id")
                print(f"   ✅ Page created successfully (v1 API)!")
                print(f"   Page ID: {page_id}")
              else:
                print(f"   ❌ Both APIs failed")
                print(f"   v1 Response: {response.text[:300]}")

          except Exception as e:
            print(f"❌ Error: {e}")
            import traceback
            traceback.print_exc()

          PYTHON_EOF

      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Architecture Analysis Validated

          - **Detailed Findings:** 7 documents ✓
          - **Synthesis Patterns:** 7 documents ✓
          - **Strategic Summary:** 1 executive overview ✓

          **Confluence Publishing:** Check the workflow logs above for status
          EOF
