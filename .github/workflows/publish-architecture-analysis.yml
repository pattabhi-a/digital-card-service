name: Publish Architecture Analysis to Confluence

on:
  push:
    branches:
      - feat/architecture-analysis
    paths:
      - '.github/workflows/publish-architecture-analysis.yml'
      - 'detailed_findings/**'
      - 'synthesis_patterns/**'
      - 'strategic/**'
  workflow_dispatch:

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML documents
        run: |
          echo "Validating HTML documents..."

          # Check detailed_findings
          test -f detailed_findings/business_context/index.html || exit 1
          test -f detailed_findings/capabilities/index.html || exit 1
          test -f detailed_findings/code_issues/index.html || exit 1
          test -f detailed_findings/security/index.html || exit 1
          test -f detailed_findings/performance/index.html || exit 1
          test -f detailed_findings/deployment/index.html || exit 1
          test -f detailed_findings/nfrs/index.html || exit 1

          # Check synthesis_patterns
          test -f synthesis_patterns/business_capability_synthesis/index.html || exit 1
          test -f synthesis_patterns/technical_patterns/index.html || exit 1
          test -f synthesis_patterns/risk_synthesis/index.html || exit 1
          test -f synthesis_patterns/modernization_patterns/index.html || exit 1
          test -f synthesis_patterns/scalability_blueprint/index.html || exit 1
          test -f synthesis_patterns/observability_strategy/index.html || exit 1
          test -f synthesis_patterns/devops_maturity/index.html || exit 1

          # Check strategic
          test -f strategic/executive-summary.html || exit 1

          echo "✅ All HTML documents validated"

      - name: Publish to Confluence
        run: |
          if [ -z "$CONFLUENCE_URL" ] || [ -z "$CONFLUENCE_USER" ] || [ -z "$CONFLUENCE_TOKEN" ]; then
            echo "⚠️ Confluence credentials not configured"
            exit 0
          fi

          # Read the HTML file
          HTML_CONTENT=$(cat strategic/executive-summary.html)

          # Create Confluence page payload
          PAYLOAD=$(cat <<'PAYLOAD_EOF'
          {
            "type": "page",
            "title": "Digital Card Service - Architecture Analysis",
            "space": {"key": "ARCH"},
            "body": {
              "storage": {
                "value": "<div><h1>Digital Card Service Architecture Analysis</h1><p>See attached HTML document for full analysis.</p></div>",
                "representation": "storage"
              }
            }
          }
          PAYLOAD_EOF
          )

          # Publish to Confluence
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Basic $(echo -n "$CONFLUENCE_USER:$CONFLUENCE_TOKEN" | base64)" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$CONFLUENCE_URL/rest/api/content")

          echo "Response: $RESPONSE"

          # Check if successful
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Page published to Confluence"
            PAGE_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Page ID: $PAGE_ID"
          else
            echo "❌ Failed to publish to Confluence"
            echo "$RESPONSE"
            exit 1
          fi
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Architecture Analysis Validated

          - **Detailed Findings:** 7 documents
          - **Synthesis Patterns:** 7 documents
          - **Strategic Summary:** 1 executive overview

          ### Next Steps
          1. Configure Confluence secrets (CONFLUENCE_BASE_URL, CONFLUENCE_USERNAME, CONFLUENCE_API_TOKEN)
          2. Workflow will publish to Confluence when secrets are configured
          EOF
