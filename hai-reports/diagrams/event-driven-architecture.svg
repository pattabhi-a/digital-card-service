<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui,sans-serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">Event-Driven Architecture (WebSub)</text>

<!-- Publishers -->
<g>
<rect x="20" y="80" width="180" height="50" fill="#08427b" rx="6"/><text x="110" y="110" text-anchor="middle" fill="white">Reg. Processor</text>
<rect x="20" y="160" width="180" height="50" fill="#08427b" rx="6"/><text x="110" y="190" text-anchor="middle" fill="white">Credential Service</text>
<rect x="20" y="240" width="180" height="50" fill="#08427b" rx="6"/><text x="110" y="270" text-anchor="middle" fill="white">Revocation Service</text>
</g>

<!-- Hub -->
<rect x="350" y="160" width="200" height="120" fill="#f6c000" rx="8" stroke="#b58800"/>
<text x="450" y="200" text-anchor="middle" font-weight="bold">WebSub Hub</text>
<text x="450" y="220" text-anchor="middle" font-size="10">topics:</text>
<text x="450" y="234" text-anchor="middle" font-size="9">identity.create</text>
<text x="450" y="248" text-anchor="middle" font-size="9">identity.update</text>
<text x="450" y="262" text-anchor="middle" font-size="9">credential.ready</text>

<!-- Service -->
<rect x="700" y="80" width="180" height="80" fill="#1168bd" rx="6"/>
<text x="790" y="110" text-anchor="middle" fill="white" font-weight="bold">Digital Card Svc</text>
<text x="790" y="130" text-anchor="middle" fill="#dde9f7" font-size="10">subscriber + publisher</text>
<text x="790" y="148" text-anchor="middle" fill="#dde9f7" font-size="10">controller:47/62/77</text>

<!-- Outbound -->
<rect x="700" y="220" width="180" height="50" fill="#999" rx="6"/><text x="790" y="250" text-anchor="middle" fill="white">Audit Service</text>
<rect x="700" y="290" width="180" height="50" fill="#999" rx="6"/><text x="790" y="320" text-anchor="middle" fill="white">Notification Svc</text>
<rect x="700" y="360" width="180" height="50" fill="#999" rx="6"/><text x="790" y="390" text-anchor="middle" fill="white">Verifier Broadcast</text>

<!-- Arrows in -->
<line x1="200" y1="105" x2="350" y2="200" stroke="#444" marker-end="url(#a)"/>
<text x="240" y="135" font-size="9">identity.create</text>
<line x1="200" y1="185" x2="350" y2="220" stroke="#444" marker-end="url(#a)"/>
<text x="240" y="200" font-size="9">identity.update</text>
<line x1="200" y1="265" x2="350" y2="240" stroke="#444" marker-end="url(#a)"/>
<text x="240" y="280" font-size="9">credential.ready</text>

<!-- Hub to service -->
<line x1="550" y1="200" x2="700" y2="120" stroke="#444" marker-end="url(#a)"/>
<text x="600" y="155" font-size="9">push (HMAC verified)</text>

<!-- Service publishes back -->
<path d="M790 160 C 700 160, 600 280, 550 270" fill="none" stroke="#1168bd" marker-end="url(#a)"/>
<text x="640" y="180" font-size="9" fill="#1168bd">publish CREDENTIAL_STATUS_UPDATE</text>
<text x="640" y="194" font-size="9" fill="#1168bd">(svc:236)</text>

<!-- Hub to outbound -->
<line x1="550" y1="240" x2="700" y2="245" stroke="#444" marker-end="url(#a)"/>
<line x1="550" y1="250" x2="700" y2="315" stroke="#444" marker-end="url(#a)"/>
<line x1="550" y1="260" x2="700" y2="385" stroke="#444" marker-end="url(#a)"/>

<!-- Resubscription -->
<rect x="350" y="370" width="200" height="50" fill="#dfe9ff" stroke="#1168bd" rx="6"/>
<text x="450" y="395" text-anchor="middle" font-size="10">DigitalCardInitializer</text>
<text x="450" y="410" text-anchor="middle" font-size="9">scheduled re-subscribe (every 100s)</text>
</svg>
