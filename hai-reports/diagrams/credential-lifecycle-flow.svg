<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui,sans-serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="700" fill="#fff"/>
<text x="500" y="22" text-anchor="middle" font-size="16" font-weight="bold">Credential Lifecycle Sequence</text>

<!-- Lanes -->
<g font-weight="bold" text-anchor="middle">
<rect x="20" y="50" width="120" height="30" fill="#08427b"/><text x="80" y="70" fill="white">Citizen</text>
<rect x="160" y="50" width="120" height="30" fill="#08427b"/><text x="220" y="70" fill="white">Reg. Processor</text>
<rect x="300" y="50" width="160" height="30" fill="#1168bd"/><text x="380" y="70" fill="white">Digital Card Svc</text>
<rect x="480" y="50" width="120" height="30" fill="#999"/><text x="540" y="70" fill="white">Credential Svc</text>
<rect x="620" y="50" width="120" height="30" fill="#999"/><text x="680" y="70" fill="white">KeyManager</text>
<rect x="760" y="50" width="100" height="30" fill="#999"/><text x="810" y="70" fill="white">DataShare</text>
<rect x="880" y="50" width="100" height="30" fill="#999"/><text x="930" y="70" fill="white">Verifier</text>
</g>

<!-- Lifelines -->
<g stroke="#bbb" stroke-dasharray="3 3">
<line x1="80" y1="80" x2="80" y2="680"/>
<line x1="220" y1="80" x2="220" y2="680"/>
<line x1="380" y1="80" x2="380" y2="680"/>
<line x1="540" y1="80" x2="540" y2="680"/>
<line x1="680" y1="80" x2="680" y2="680"/>
<line x1="810" y1="80" x2="810" y2="680"/>
<line x1="930" y1="80" x2="930" y2="680"/>
</g>

<g font-size="10">
<!-- 1 initiation -->
<line x1="80" y1="110" x2="220" y2="110" stroke="#333" marker-end="url(#a)"/><text x="150" y="105">1. enrol</text>
<!-- 2 identity event -->
<line x1="220" y1="150" x2="380" y2="150" stroke="#333" marker-end="url(#a)"/><text x="300" y="145">2. WebSub identity.create</text>
<!-- 3 fetch -->
<line x1="380" y1="190" x2="540" y2="190" stroke="#333" marker-end="url(#a)"/><text x="460" y="185">3. credential request (svc:183)</text>
<!-- 4 wrap -->
<line x1="540" y1="230" x2="380" y2="230" stroke="#333" marker-end="url(#a)"/><text x="460" y="225">4. credential ready (WebSub)</text>
<!-- 5 datashare fetch -->
<line x1="380" y1="270" x2="810" y2="270" stroke="#333" marker-end="url(#a)"/><text x="600" y="265">5. GET dataShareUrl (svc:119)</text>
<!-- 6 decrypt -->
<line x1="380" y1="310" x2="680" y2="310" stroke="#333" marker-end="url(#a)"/><text x="530" y="305">6. decrypt (EncryptionUtil:84)</text>
<!-- 7 PDF + sign -->
<rect x="350" y="340" width="60" height="80" fill="#dfe9ff" stroke="#1168bd"/><text x="380" y="370" text-anchor="middle">PDF gen</text><text x="380" y="385" text-anchor="middle" font-size="9">(PDF:146)</text>
<line x1="380" y1="420" x2="680" y2="420" stroke="#333" marker-end="url(#a)"/><text x="530" y="415">7. sign (PDF:360)</text>
<!-- 8 store + publish -->
<line x1="380" y1="470" x2="810" y2="470" stroke="#333" marker-end="url(#a)"/><text x="600" y="465">8. POST dataShare (svc:213)</text>
<line x1="380" y1="510" x2="220" y2="510" stroke="#333" marker-end="url(#a)"/><text x="300" y="505">9. WebSub status STORED</text>
<!-- 10 deliver -->
<line x1="220" y1="550" x2="80" y2="550" stroke="#333" marker-end="url(#a)"/><text x="150" y="545">10. notify citizen</text>
<!-- 11 verify -->
<line x1="80" y1="600" x2="930" y2="600" stroke="#333" marker-end="url(#a)"/><text x="500" y="595">11. present QR</text>
<line x1="930" y1="640" x2="380" y2="640" stroke="#333" marker-end="url(#a)"/><text x="650" y="635">12. verify (out of band)</text>
</g>
</svg>
