<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="system-ui,sans-serif" font-size="11">
<rect width="1000" height="460" fill="#fff"/>
<text x="500" y="24" text-anchor="middle" font-size="16" font-weight="bold">Modernization Roadmap (20 weeks · $128K)</text>

<!-- Axis -->
<line x1="160" y1="380" x2="940" y2="380" stroke="#444"/>
<g font-size="10" text-anchor="middle">
<g><line x1="160" y1="380" x2="160" y2="385" stroke="#444"/><text x="160" y="400">W0</text></g>
<g><line x1="238" y1="380" x2="238" y2="385" stroke="#444"/><text x="238" y="400">W2</text></g>
<g><line x1="394" y1="380" x2="394" y2="385" stroke="#444"/><text x="394" y="400">W6</text></g>
<g><line x1="550" y1="380" x2="550" y2="385" stroke="#444"/><text x="550" y="400">W10</text></g>
<g><line x1="667" y1="380" x2="667" y2="385" stroke="#444"/><text x="667" y="400">W13</text></g>
<g><line x1="784" y1="380" x2="784" y2="385" stroke="#444"/><text x="784" y="400">W16</text></g>
<g><line x1="940" y1="380" x2="940" y2="385" stroke="#444"/><text x="940" y="400">W20</text></g>
</g>

<!-- Bars -->
<g font-size="10">
<rect x="160" y="60" width="78" height="32" fill="#dc2626" rx="4"/><text x="155" y="80" text-anchor="end">P0 — Critical Sec</text><text x="199" y="80" fill="white" text-anchor="middle">$10K · 2w</text>
<rect x="238" y="100" width="156" height="32" fill="#fb923c" rx="4"/><text x="232" y="120" text-anchor="end">P1 — Perf Foundation</text><text x="316" y="120" fill="white" text-anchor="middle">$25K · 4w</text>
<rect x="394" y="140" width="156" height="32" fill="#f59e0b" rx="4"/><text x="388" y="160" text-anchor="end">P2 — Async</text><text x="472" y="160" fill="white" text-anchor="middle">$30K · 4w</text>
<rect x="550" y="180" width="117" height="32" fill="#10b981" rx="4"/><text x="544" y="200" text-anchor="end">P3 — Observability</text><text x="608" y="200" fill="white" text-anchor="middle">$18K · 3w</text>
<rect x="667" y="220" width="117" height="32" fill="#0ea5e9" rx="4"/><text x="661" y="240" text-anchor="end">P4 — Sec Hardening</text><text x="725" y="240" fill="white" text-anchor="middle">$20K · 3w</text>
<rect x="784" y="260" width="156" height="32" fill="#6366f1" rx="4"/><text x="778" y="280" text-anchor="end">P5 — Code Quality</text><text x="862" y="280" fill="white" text-anchor="middle">$25K · 4w</text>
</g>

<!-- Milestones -->
<g font-size="10">
<line x1="238" y1="40" x2="238" y2="380" stroke="#dc2626" stroke-dasharray="4 3"/>
<text x="240" y="48" fill="#dc2626">M1: Security baseline</text>
<line x1="550" y1="40" x2="550" y2="380" stroke="#f59e0b" stroke-dasharray="4 3"/>
<text x="552" y="48" fill="#f59e0b">M2: 10× throughput</text>
<line x1="940" y1="40" x2="940" y2="380" stroke="#6366f1" stroke-dasharray="4 3"/>
<text x="935" y="48" text-anchor="end" fill="#6366f1">M3: Modernization complete</text>
</g>

<text x="160" y="430" font-size="10" fill="#666">Each phase begins after prior gate; some can overlap (P3 with P2 worker rollout).</text>
</svg>
